name: 앱인토스 .ait 빌드

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "icon.png"
      - "icon-192.png"
      - "apple-touch-icon-v2.png"
      - "appsintoss/**"
      - ".github/workflows/appsintoss.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appsintoss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appsintoss/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # 비어 있으면 테스트 광고 ID 로 빌드돼요. 출시용은 저장소 Settings › Variables 에 TOSS_BANNER_AD_ID 를 넣어요.
          TOSS_BANNER_AD_ID: ${{ vars.TOSS_BANNER_AD_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: startrip-ait
          path: appsintoss/startrip.ait
          retention-days: 30
